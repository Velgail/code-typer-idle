name: Game rules
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: git diff --exit-code -- docs
      - run: npm test
      - run: npm run learning:audit -- --write
      - run: git diff --exit-code -- research/learning-catalog.json
      - run: npm run difficulty:audit -- --write
      - run: git diff --exit-code -- research/challenge-difficulty-review.json
      - run: npm run reading:audit -- --write
      - run: git diff --exit-code -- research/reading-choices.json
      - run: npm run test:runtimes
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:quiz
  curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update -qq && sudo apt-get install -y mono-mcs lua5.4
      - run: npm run test:curriculum -- --all
